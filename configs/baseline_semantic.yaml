experiment:
  name: drf_baseline_semantic
  log_dir: ./logs
backbone:
  clip_name: openai/clip-vit-large-patch14
  freeze_clip: true
residual:
  c_token: 192
  token_grid: 8
  use_srm: false
fusion:
  embed_dim: 256
  num_heads: 8
  fused_dim: 128
  dropout: 0.1
  use_gate: false
model:
  use_boundary_head: false
  use_semantic: true
  use_residual: false
data:
  image_size: 224
  normalization: clip
  batch_size: 32
  num_workers: 4
  augment_strength: 1.0
  train_json: ./data/ffpp_c23_train.json
  val_jsons:
    ffpp_val: ./data/ffpp_c23_val.json
  test_jsons:
    cdfv2: ./data/cdfv2_test.json
    dfdc: ./data/dfdc_test.json
    wilddeepfake: ./data/wilddeepfake_test.json
loss:
  label_smoothing: 0.05
  contrastive_weight: 0.0
  contrastive_temperature: 0.07
  num_hard_neg: 16
optim:
  lr: 0.0002
  weight_decay: 0.001
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
train:
  num_epochs: 8
  use_amp: true
  grad_accum_steps: 2
  grad_clip_norm: 1.0
  ema_decay: 0.999
