# ============================================================
# 消融实验: 关闭 Hard-Negative SupCon 辅助损失 (只剩 BCE 主损失)
# 唯一差异: experiment.name + loss.contrastive_weight = 0
# ============================================================
experiment:
  name: drf_v2_ablation_no_supcon
  log_dir: ./logs

backbone:
  clip_name: openai/clip-vit-base-patch32
  freeze_clip: true

residual:
  c_token: 192
  token_grid: 8
  use_srm: true

fusion:
  embed_dim: 256
  num_heads: 8
  fused_dim: 128
  dropout: 0.1
  use_gate: true

model:
  use_boundary_head: false

data:
  image_size: 224
  batch_size: 16
  num_workers: 4
  augment_strength: 1.0
  train_json: ./data/ffpp_c23_train.json
  test_jsons:
    cdfv2: ./data/celebdfv2_test.json

loss:
  label_smoothing: 0.05
  contrastive_weight: 0.0       # ← 消融点: 完全关闭对比损失
  contrastive_temperature: 0.1
  num_hard_neg: 16

optim:
  lr: 0.0002
  weight_decay: 0.0005
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

train:
  num_epochs: 10
  use_amp: true
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  ema_decay: 0.999
