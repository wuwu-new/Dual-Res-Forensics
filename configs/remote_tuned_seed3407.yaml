experiment:
  name: drf_v2_remote_tuned_seed3407
  log_dir: ./logs
backbone:
  clip_name: openai/clip-vit-base-patch32
  freeze_clip: true
residual:
  c_token: 192
  token_grid: 8
  use_srm: true
fusion:
  embed_dim: 256
  num_heads: 8
  fused_dim: 128
  dropout: 0.1
  use_gate: true
model:
  use_boundary_head: false
data:
  image_size: 224
  batch_size: 64
  num_workers: 4
  augment_strength: 1.3
  train_json: ./data/ffpp_c23_train.json
  test_jsons:
    cdfv2: ./data/cdfv2_test.json
    dfdc:  ./data/dfdc_test.json
loss:
  label_smoothing: 0.05
  contrastive_weight: 0.3
  contrastive_temperature: 0.07
  num_hard_neg: 32
optim:
  lr: 0.0002
  weight_decay: 0.001
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
train:
  num_epochs: 8
  use_amp: true
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  ema_decay: 0.999
