experiment:
  name: baseline_xception
  log_dir: ./logs
model:
  architecture: xception
  pretrained: true
  dropout: 0.2
data:
  image_size: 299
  normalization: xception
  batch_size: 32
  num_workers: 4
  augment_strength: 1.0
  train_json: ./data/ffpp_c23_train.json
  val_jsons:
    ffpp_val: ./data/ffpp_c23_val.json
  test_jsons:
    cdfv2: ./data/cdfv2_test.json
    dfdc: ./data/dfdc_test.json
    wilddeepfake: ./data/wilddeepfake_test.json
loss:
  label_smoothing: 0.05
  contrastive_weight: 0.0
  contrastive_temperature: 0.07
  num_hard_neg: 16
optim:
  lr: 0.0002
  weight_decay: 0.001
  warmup_ratio: 0.05
  min_lr_ratio: 0.01
train:
  num_epochs: 8
  use_amp: true
  grad_accum_steps: 2
  grad_clip_norm: 1.0
  ema_decay: 0.999
