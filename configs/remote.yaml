# ============================================================
# 远端 (RTX 5090 32G) 训练配置
# 数据: FF++ c23 训练, Celeb-DF-v2 + DFDC 测试
# 与 default.yaml 的差异: 更大 batch + 更多 workers + 远端路径
# ============================================================
experiment:
  name: drf_v2_remote
  log_dir: ./logs

backbone:
  clip_name: openai/clip-vit-base-patch32
  freeze_clip: true

residual:
  c_token: 192
  token_grid: 8
  use_srm: true

fusion:
  embed_dim: 256
  num_heads: 8
  fused_dim: 128
  dropout: 0.1
  use_gate: true

model:
  use_boundary_head: false

data:
  image_size: 224
  batch_size: 64              # 5090 32G 可承受
  num_workers: 4              # 云容器 8 worker 容易死锁, 改 4 更稳
  augment_strength: 1.0
  train_json: ./data/ffpp_c23_train.json
  test_jsons:
    cdfv2: ./data/cdfv2_test.json
    dfdc:  ./data/dfdc_test.json

loss:
  label_smoothing: 0.05
  contrastive_weight: 0.1
  contrastive_temperature: 0.1
  num_hard_neg: 16

optim:
  lr: 0.0004                  # batch=64 配 lr=4e-4
  weight_decay: 0.0005
  warmup_ratio: 0.05
  min_lr_ratio: 0.01

train:
  num_epochs: 15
  use_amp: true
  grad_accum_steps: 1
  grad_clip_norm: 1.0
  ema_decay: 0.999
